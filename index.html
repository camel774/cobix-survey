<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>COBIX 의견 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* COBIX 의견 설문 — 따로 올리는 한 장짜리 사이트(index.html 하나).
   마지막 화면의 [제출하기]가 답을 구글 설문으로 보내고, 답은 연결된 구글 시트에 쌓입니다. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 한 화면에 질문 하나. 위에는 진행 눈금, 가운데는 질문과 보기, 아래는 이전·다음. 휴대폰 한 손 조작이 기준. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --fg:#16202e; --muted:#5a6779; --line:#d3dae5;
  --accent:#2347c5; --accent-weak:#e5ebfb; --on-accent:#ffffff; --ok:#1c7a4c; --warn:#a4541a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#18202b; --fg:#e8edf4; --muted:#9aa7b8; --line:#2c3746;
    --accent:#86a6ff; --accent-weak:#1b2947; --on-accent:#0b1220; --ok:#5fcf97; --warn:#e9a56b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --fg:#e8edf4; --muted:#9aa7b8; --line:#2c3746;
  --accent:#86a6ff; --accent-weak:#1b2947; --on-accent:#0b1220; --ok:#5fcf97; --warn:#e9a56b;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{box-sizing:border-box;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 18px}

/* 진행 눈금 */
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{font-weight:700;letter-spacing:.04em;font-size:14px}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s ease}

/* 질문 */
.stage{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.stage.in{animation:in .2s ease both}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.stage.in{animation:none}.bar i{transition:none}}
.kicker{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
h1{margin:0;font-size:22px;line-height:1.38;font-weight:600;text-wrap:balance;word-break:keep-all}
.hint{margin:0;color:var(--muted);font-size:14.5px;word-break:keep-all}
.lead{margin:0;font-size:16px;word-break:keep-all}
ul.notes{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14.5px;word-break:keep-all}

/* 보기 */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;text-align:left;
  background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:var(--r);
  font:inherit;font-size:16px;cursor:pointer;word-break:keep-all}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.opt.multi .n{border-radius:8px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.opt[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt:disabled{opacity:.45;cursor:default}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 1~5 점수 */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale .opt{flex-direction:column;justify-content:center;gap:2px;min-height:68px;padding:8px 4px;text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.feature{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:17px;font-weight:500;word-break:keep-all}
.feature b{color:var(--accent);margin-right:6px}

/* 글 입력 */
textarea,input[type=text]{width:100%;box-sizing:border-box;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);
  border-radius:var(--r);padding:12px 14px;font:inherit;font-size:16px}
textarea{min-height:132px;resize:vertical}
textarea.result{min-height:300px;font-size:14.5px;line-height:1.6}

/* 아래 단추 */
.nav{display:flex;gap:10px;align-items:center}
.btn{min-height:50px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.state{font-size:14.5px;color:var(--ok);font-weight:600;min-height:1.5em;margin:0}
.state.warn{color:var(--warn)}
.site{color:var(--accent);font-weight:600;word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">COBIX 의견 설문</span>
    <span class="count" id="count"></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <main class="stage" id="stage"></main>
  <div class="nav" id="nav"></div>
</div>

<script>
(function(){
  var SITE = 'https://cci-radar.ysj774.workers.dev/';   /* COBIX 사이트 */
  var PILOT = true;                 /* 시범판에만 14번을 붙입니다 */
  var KEY = 'cobix-survey-v1';
  /* 답을 받아 두는 곳: 구글 설문 'COBIX 의견 설문 응답' (응답은 연결된 구글 시트에 한 줄씩 쌓입니다) */
  var FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSf9rMhuXQ6zUqf4rxJVM5SNATQgJ0R7H8mCADwveqg894p4WA/formResponse';
  var FORM_ENTRY = 'entry.1241421569';

  var FEATURES = [
    ['A','앞으로 6~12개월 공사비 상승률 전망 (한 점이 아니라 범위로)'],
    ['B','착공부터 준공까지의 상승분 계산 (예비비·계약 조항의 근거)'],
    ['C','어느 자재·요인이 공사비를 밀고 있는지 나눠 보기'],
    ['D','반덤핑 같은 무역조치와 수입 물량 변화가 공사비에 주는 영향'],
    ['E','설계안(BIM)의 물량에 전망 단가를 곱해 건물별 공사비·사업성 계산 (개발 예정)'],
    ['F','원가와 분양가격(시세)의 차이 비교'],
    ['G','품셈·단가·물가변동 제도를 한곳에 정리한 건설 정보']
  ];

  var STEPS = [
    {id:'intro', type:'intro'},
    {id:'q1', no:'1', label:'소속', type:'single', title:'소속 분야를 하나 골라 주십시오.',
     opts:['중앙부처·지자체','공기업·공공 발주기관','시행·개발·정비사업 조합','시공사','설계·엔지니어링·CM·적산','자재 생산·유통','금융·보증','연구·학계',{t:'기타',other:true}]},
    {id:'q2', no:'2', label:'하는 일', type:'multi', title:'공사비와 관련해 하시는 일을 모두 골라 주십시오.',
     opts:['사업비·예산 편성','예정가격·설계가 산정','입찰·견적','계약 관리·물가변동 조정','사업성 검토·투자 심사','정책·제도',{t:'공사비를 직접 다루지는 않음',only:true}]},
    {id:'q3', no:'3', label:'공사비 근거', type:'multi', max:2, title:'사업 초기에 공사비를 잡을 때 주로 무엇을 근거로 하십니까?', hint:'두 가지까지 고를 수 있습니다.',
     opts:['평당(㎡당) 단가 × 면적','비슷한 사업의 실적 공사비','표준품셈·표준시장단가로 개산','적산사무소·견적 전문가에게 의뢰','시공사가 내놓은 금액',{t:'해당 없음',only:true},{t:'기타',other:true}]},
    {id:'q4', no:'4', label:'상승분 반영', type:'single', title:'계획 시점부터 착공·준공까지 오를 공사비는 어떻게 반영하십니까?',
     opts:['반영하지 않음 (지금 단가 그대로)','경험으로 일정 비율을 얹음 (예: 연 몇 %)','건설공사비지수 등 과거 추세를 연장','외부 전망 자료를 참고','계약 뒤 물가변동 조정으로 처리','모름·해당 없음']},
    {id:'q5', no:'5', label:'겪은 일', type:'multi', title:'최근 3년 안에 공사비 상승 때문에 실제로 겪으신 일을 모두 골라 주십시오.',
     opts:['유찰·재입찰','사업비 증액·예산 재편성','시공사와 증액 협의·분쟁','사업 지연·중단','사업성 악화로 포기',{t:'없음',only:true}]},
    {id:'q5t', no:'5-1', label:'사례', type:'text', optional:true, title:'가장 기억나는 사례가 있으면 한 줄 적어 주십시오.', hint:'없으면 건너뛰셔도 됩니다.'},
    {id:'visit', type:'visit'}
  ];
  FEATURES.forEach(function(f, i){
    STEPS.push({id:'q6'+f[0], no:'6', sub:(i+1)+'/7', type:'scale', feature:f,
      title:'이 기능이 하시는 일에 얼마나 쓸모 있겠습니까?'});
  });
  STEPS.push(
    {id:'q7', no:'7', label:'가장 먼저', type:'single', title:'방금 보신 일곱 가지 가운데 하나만 고른다면, 가장 먼저 필요한 것은 무엇입니까?',
     opts:FEATURES.map(function(f){ return f[0]+'. '+f[1]; })},
    {id:'q8', no:'8', label:'쓰임', type:'single', title:'이 서비스에 가장 맞는 쓰임은 무엇이라고 보십니까?',
     opts:['건축 사업성을 따져 보는 도구','정책·제도를 판단할 때의 근거 자료','계약과 물가변동을 관리하는 도구','견적·입찰의 참고 자료','잘 모르겠음']},
    {id:'q9', no:'9', label:'믿으려면', type:'multi', max:2, title:'믿고 쓰려면 무엇이 가장 필요합니까?', hint:'두 가지까지 고를 수 있습니다.',
     opts:['예측이 맞았는지 틀렸는지를 공개한 기록','공공기관·학회의 검증','계산 방법의 공개','우리 기관·회사 자료에 맞춘 결과','사람이 직접 해 주는 설명·자문',{t:'기타',other:true}]},
    {id:'q10', no:'10', label:'쓸 의향', type:'single', title:'업무에 쓰실 의향이 있으십니까?',
     opts:['지금 바로 써 보겠다','무료라면 참고하겠다','기관·회사 차원의 검토가 먼저 필요하다','쓸 일이 없다']},
    {id:'q11', no:'11', label:'유료 방식', type:'single', title:'돈을 내고 쓴다면 어떤 방식이 맞습니까?',
     opts:['개인·팀 단위 월 구독','기관·회사 단위 연간 계약','건별 보고서·자문','연구용역','돈을 낼 대상은 아니다']},
    {id:'q11t', no:'11-1', label:'금액', type:'text', optional:true, short:true, title:'적정하다고 보시는 금액이 있으면 적어 주십시오.', hint:'예: 월 5만 원, 건당 300만 원. 없으면 건너뛰셔도 됩니다.'},
    {id:'q12', no:'12', label:'아쉬운 점', type:'text', optional:true, title:'가장 아쉽거나 믿기 어려운 점을 한 가지만 적어 주십시오.', hint:'잘한 점보다 이 답이 가장 도움이 됩니다.'},
    {id:'q13', no:'13', label:'추천·연락처', type:'text', optional:true, title:'이 설문을 보내 보면 좋을 분이나 기관이 있습니까?', hint:'20분쯤 따로 이야기해 주실 수 있으면 연락처도 적어 주십시오. 없으면 건너뛰셔도 됩니다.'}
  );
  if (PILOT) STEPS.push({id:'q14', no:'14', label:'설문 의견', type:'text', optional:true, title:'이해하기 어려웠던 문항이나 빠졌다고 느끼신 질문이 있습니까?', hint:'설문을 고치는 데 씁니다.'});
  STEPS.push({id:'qname', kick:'마지막 질문', label:'성함', type:'text', optional:true, short:true, title:'성함을 적어 주시겠습니까?', hint:'누구의 의견인지 알기 위한 것이고 밖으로 내지 않습니다. 적지 않으셔도 됩니다.'});
  STEPS.push({id:'done', type:'done'});

  var A = {};      /* 답 */
  var idx = 0;     /* 지금 화면 */
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.a && typeof saved.i === 'number' && saved.i < STEPS.length) { A = saved.a; idx = saved.i; }
  } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({a:A, i:idx})); } catch (e) {} }

  var stage = document.getElementById('stage'), nav = document.getElementById('nav');
  var bar = document.getElementById('bar'), count = document.getElementById('count');
  var timer = null;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function optText(o){ return typeof o === 'string' ? o : o.t; }
  function isOther(o){ return typeof o !== 'string' && o.other; }
  function isOnly(o){ return typeof o !== 'string' && o.only; }

  function answered(s){
    var a = A[s.id];
    if (s.type === 'single'){
      if (!a || a.v == null) return false;
      return !isOther(s.opts[a.v]) || !!(a.other && a.other.trim());
    }
    if (s.type === 'multi'){
      if (!a || !a.v || !a.v.length) return false;
      var needs = a.v.some(function(i){ return isOther(s.opts[i]); });
      return !needs || !!(a.other && a.other.trim());
    }
    if (s.type === 'scale') return typeof a === 'number';
    if (s.type === 'text') return s.optional || !!(a && a.trim());
    return true;
  }

  function go(n){
    if (timer){ clearTimeout(timer); timer = null; }
    idx = Math.max(0, Math.min(STEPS.length - 1, n));
    save(); render(true);
  }
  function next(){ if (answered(STEPS[idx])) go(idx + 1); }

  function render(animate){
    var s = STEPS[idx];
    var qTotal = STEPS.length - 2;                       /* 안내·마침 화면은 세지 않습니다 */
    bar.style.width = (idx / (STEPS.length - 1) * 100).toFixed(1) + '%';
    count.textContent = (idx === 0 || s.type === 'done') ? '' : idx + ' / ' + qTotal;
    stage.textContent = ''; nav.textContent = '';
    stage._pick = null; stage._n = 0;
    stage.className = 'stage';
    if (animate){ void stage.offsetWidth; stage.className = 'stage in'; }
    ({intro:rIntro, visit:rVisit, single:rChoice, multi:rChoice, scale:rScale, text:rText, done:rDone})[s.type](s);
    window.scrollTo(0, 0);
  }

  function navButtons(s, opts){
    opts = opts || {};
    if (idx > 0){ var b = el('button', 'btn ghost', '이전'); b.type = 'button'; b.onclick = function(){ go(idx - 1); }; nav.appendChild(b); }
    if (opts.next !== false){
      var n = el('button', 'btn primary', opts.label || '다음'); n.type = 'button'; n.id = 'nextBtn';
      n.disabled = !answered(s); n.onclick = next; nav.appendChild(n);
    }
  }
  function refreshNext(s, label){
    var n = document.getElementById('nextBtn');
    if (n){ n.disabled = !answered(s); if (label) n.textContent = label; }
  }

  function rIntro(){
    stage.appendChild(el('div', 'kicker', '5분 안팎 · 보기를 누르면 넘어갑니다'));
    stage.appendChild(el('h1', null, '건설 공사비 전망 서비스에 대한 의견을 여쭙습니다'));
    stage.appendChild(el('p', 'lead', '건국대학교 건축공학과 여승준입니다. COBIX는 건설 공사비가 앞으로 얼마나 오를지를 공개 자료로 계산해 보여 주는 서비스이고, 지금 만드는 중입니다. 실제 업무에 쓸모가 있는지, 있다면 어느 쪽으로 만들어야 하는지 듣고 싶습니다.'));
    var ul = el('ul', 'notes');
    ['보기를 누르면 다음 문항으로 넘어갑니다. 여러 개를 고르는 문항만 [다음]을 눌러 주십시오.',
     '중간에 사이트를 2분쯤 둘러보는 순서가 있습니다.',
     '이름과 소속은 밖으로 내지 않습니다.',
     '마지막 화면에서 [제출하기]를 누르면 답이 전달됩니다.'
    ].forEach(function(t){ ul.appendChild(el('li', null, t)); });
    stage.appendChild(ul);
    var b = el('button', 'btn primary', Object.keys(A).length ? '이어서 답하기' : '시작하기'); b.type = 'button';
    b.onclick = function(){ go(1); }; nav.appendChild(b);
  }

  function rVisit(s){
    stage.appendChild(el('div', 'kicker', '여기서 잠깐'));
    stage.appendChild(el('h1', null, '사이트를 2분쯤 둘러봐 주십시오'));
    stage.appendChild(el('p', 'lead', '다음 문항부터는 COBIX를 보신 느낌을 여쭙습니다. 아래 단추를 누르면 새 창에서 사이트가 열립니다. 첫 화면의 그림과 왼쪽 목차만 훑어보셔도 충분합니다.'));
    var a = el('a', 'btn', 'COBIX 사이트 열기'); a.href = SITE; a.target = '_blank'; a.rel = 'noopener';
    stage.appendChild(a);
    var p = el('p', 'hint', '열리지 않으면 이 주소를 눌러 주십시오. '); var l = el('a', 'site', SITE.replace('https://', '').replace(/\/$/, ''));
    l.href = SITE; l.target = '_blank'; l.rel = 'noopener'; p.appendChild(l); stage.appendChild(p);
    navButtons(s, {label:'둘러봤습니다'});
  }

  function head(s){
    stage.appendChild(el('div', 'kicker', s.kick || ('문항 ' + s.no + (s.sub ? ' · ' + s.sub : ''))));
    stage.appendChild(el('h1', null, s.title));
    if (s.hint) stage.appendChild(el('p', 'hint', s.hint));
  }

  function rChoice(s){
    head(s);
    var multi = s.type === 'multi';
    var a = A[s.id] || (A[s.id] = multi ? {v:[], other:''} : {v:null, other:''});
    var box = el('div', 'opts'); box.setAttribute('role', 'group');
    var otherInput = null;

    function isOn(i){ return multi ? a.v.indexOf(i) >= 0 : a.v === i; }
    function paint(){
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b, i){
        var on = isOn(i);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.disabled = multi && s.max && !on && a.v.length >= s.max && !isOnly(s.opts[i]) && !a.v.some(function(j){ return isOnly(s.opts[j]); });
      });
      var showOther = (multi ? a.v : (a.v == null ? [] : [a.v])).some(function(i){ return isOther(s.opts[i]); });
      if (otherInput) otherInput.hidden = !showOther;
      refreshNext(s);
    }
    function pick(i){
      var o = s.opts[i];
      if (multi){
        var at = a.v.indexOf(i);
        if (at >= 0) a.v.splice(at, 1);
        else if (isOnly(o)) a.v = [i];
        else {
          a.v = a.v.filter(function(j){ return !isOnly(s.opts[j]); });
          if (s.max && a.v.length >= s.max) return;
          a.v.push(i);
        }
        a.v.sort(function(x, y){ return x - y; });
        save(); paint();
        if (isOther(o) && isOn(i) && otherInput) otherInput.focus();
      } else {
        a.v = i; save(); paint();
        if (isOther(o)){ if (otherInput) otherInput.focus(); }
        else timer = setTimeout(function(){ go(idx + 1); }, 230);   /* 누르면 넘어갑니다 */
      }
    }
    s.opts.forEach(function(o, i){
      var b = el('button', 'opt' + (multi ? ' multi' : '')); b.type = 'button';
      b.appendChild(el('span', 'n', String(i + 1)));
      b.appendChild(el('span', null, optText(o)));
      b.onclick = function(){ pick(i); };
      box.appendChild(b);
    });
    stage.appendChild(box);
    if (s.opts.some(isOther)){
      otherInput = el('input'); otherInput.type = 'text'; otherInput.id = s.id + '-other';
      otherInput.placeholder = '직접 적어 주십시오'; otherInput.value = a.other || ''; otherInput.setAttribute('aria-label', '기타 내용');
      otherInput.oninput = function(){ a.other = otherInput.value; save(); refreshNext(s); };
      stage.appendChild(otherInput);
    }
    stage._pick = pick; stage._n = s.opts.length;
    navButtons(s, {next: multi || s.opts.some(isOther) || answered(s)});
    paint();
  }

  function rScale(s){
    head(s);
    var f = el('div', 'feature'); f.appendChild(el('b', null, s.feature[0])); f.appendChild(document.createTextNode(s.feature[1]));
    stage.appendChild(f);
    var box = el('div', 'opts scale'); box.setAttribute('role', 'group');
    function pick(i){
      A[s.id] = i + 1; save();
      Array.prototype.forEach.call(box.children, function(b, j){ b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
      timer = setTimeout(function(){ go(idx + 1); }, 230);
    }
    for (var i = 0; i < 5; i++) (function(i){
      var b = el('button', 'opt', String(i + 1)); b.type = 'button';
      b.setAttribute('aria-pressed', A[s.id] === i + 1 ? 'true' : 'false');
      b.setAttribute('aria-label', (i + 1) + '점');
      b.onclick = function(){ pick(i); }; box.appendChild(b);
    })(i);
    stage.appendChild(box);
    var ends = el('div', 'ends'); ends.appendChild(el('span', null, '1 전혀 없음')); ends.appendChild(el('span', null, '5 매우 있음'));
    stage.appendChild(ends);
    stage._pick = pick; stage._n = 5;
    navButtons(s, {next: answered(s)});
  }

  function rText(s){
    head(s);
    var t = el(s.short ? 'input' : 'textarea'); if (s.short) t.type = 'text';
    t.id = s.id + '-text'; t.value = A[s.id] || ''; t.setAttribute('aria-label', s.title);
    function lab(){ return s.optional && !(t.value || '').trim() ? '건너뛰기' : '다음'; }
    t.oninput = function(){ A[s.id] = t.value; save(); refreshNext(s, lab()); };
    stage.appendChild(t);
    navButtons(s, {label: lab()});
  }

  /* 응답을 사람이 읽는 글로 */
  function summary(){
    function one(id){ var s = find(id), a = A[id]; if (!a || a.v == null) return '(무응답)';
      var o = s.opts[a.v]; return isOther(o) ? '기타: ' + (a.other || '').trim() : optText(o); }
    function many(id){ var s = find(id), a = A[id]; if (!a || !a.v || !a.v.length) return '(무응답)';
      return a.v.map(function(i){ var o = s.opts[i]; return isOther(o) ? '기타: ' + (a.other || '').trim() : optText(o); }).join(' / '); }
    function txt(id){ var v = (A[id] || '').trim(); return v || '(없음)'; }
    function find(id){ for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === id) return STEPS[i]; }
    var d = new Date(), pad = function(n){ return (n < 10 ? '0' : '') + n; };
    var L = ['[COBIX 의견 설문 응답] ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      '1. 소속: ' + one('q1'),
      '2. 하는 일: ' + many('q2'),
      '3. 공사비 근거: ' + many('q3'),
      '4. 상승분 반영: ' + one('q4'),
      '5. 겪은 일: ' + many('q5'),
      '5-1. 사례: ' + txt('q5t'),
      '6. 쓸모(1~5): ' + FEATURES.map(function(f){ var v = A['q6' + f[0]]; return f[0] + ' ' + (typeof v === 'number' ? v : '-'); }).join(' · '),
      '7. 가장 먼저: ' + one('q7'),
      '8. 맞는 쓰임: ' + one('q8'),
      '9. 믿으려면: ' + many('q9'),
      '10. 쓸 의향: ' + one('q10'),
      '11. 유료 방식: ' + one('q11'),
      '11-1. 금액: ' + txt('q11t'),
      '12. 아쉬운 점: ' + txt('q12'),
      '13. 추천·연락처: ' + txt('q13')];
    if (PILOT) L.push('14. 설문 의견: ' + txt('q14'));
    L.push('성함: ' + txt('qname'));
    return L.join('\n');
  }

  function payload(){
    var d = {};
    Object.keys(A).forEach(function(k){ d[k] = A[k]; });
    return summary() + '\n[자료] ' + JSON.stringify(d);
  }
  function sentAt(){ try { return localStorage.getItem(KEY + '-sent') || ''; } catch (e) { return ''; } }

  function rDone(s){
    var already = sentAt();
    stage.appendChild(el('div', 'kicker', '마지막 단계'));
    stage.appendChild(el('h1', null, already ? '제출하셨습니다. 고맙습니다' : '아래 내용으로 제출합니다'));
    stage.appendChild(el('p', 'lead', already
      ? '답은 이미 전달됐습니다. 이 창은 닫으셔도 됩니다.'
      : '답해 주셔서 고맙습니다. 아직 보내진 것은 아닙니다. 내용을 확인하고 [제출하기]를 눌러 주십시오. 고칠 곳이 있으면 [이전]으로 돌아가시면 됩니다.'));
    var ta = el('textarea', 'result'); ta.id = 'result'; ta.readOnly = true; ta.value = summary(); ta.setAttribute('aria-label', '응답 내용');
    stage.appendChild(ta);
    var st = el('p', 'state'); st.setAttribute('role', 'status'); stage.appendChild(st);

    var back = el('button', 'btn ghost', '이전'); back.type = 'button'; back.onclick = function(){ go(idx - 1); };
    if (!already) nav.appendChild(back);

    var cp = el('button', 'btn', '응답 복사'); cp.type = 'button'; cp.id = 'copyBtn';
    cp.onclick = function(){
      function fallback(){ ta.focus(); ta.select(); st.className = 'state warn'; st.textContent = '자동 복사가 되지 않았습니다. 위 글이 선택돼 있으니 길게 눌러 복사해 주십시오.'; }
      try {
        navigator.clipboard.writeText(ta.value).then(function(){ st.className = 'state'; st.textContent = '복사했습니다.'; }, fallback);
      } catch (e) { fallback(); }
    };
    nav.appendChild(cp);

    var send = el('button', 'btn primary', already ? '제출됨' : '제출하기'); send.type = 'button'; send.id = 'sendBtn';
    send.disabled = !!already;
    send.onclick = function(){
      send.disabled = true; send.textContent = '보내는 중';
      st.className = 'state'; st.textContent = '';
      var body = new URLSearchParams(); body.append(FORM_ENTRY, payload());
      /* 구글 설문은 다른 사이트에서 보낸 요청의 결과를 읽지 못하게 합니다(no-cors).
         그래서 '보냈다'까지만 알 수 있고 '받았다'는 확인하지 못합니다. 통신 오류는 잡힙니다. */
      fetch(FORM_URL, {method:'POST', mode:'no-cors', body: body}).then(function(){
        try { localStorage.setItem(KEY + '-sent', new Date().toISOString()); } catch (e) {}
        send.textContent = '제출됨'; back.hidden = true;
        stage.querySelector('h1').textContent = '제출하셨습니다. 고맙습니다';
        stage.querySelector('.lead').textContent = '답이 전달됐습니다. 이 창은 닫으셔도 됩니다.';
        st.className = 'state'; st.textContent = '제출했습니다.';
      }, function(){
        send.disabled = false; send.textContent = '다시 제출하기';
        st.className = 'state warn';
        st.textContent = '전송되지 않았습니다. 인터넷 연결을 확인하고 다시 눌러 주십시오. 계속 안 되면 [응답 복사]로 복사해 카카오톡이나 문자로 보내 주십시오.';
      });
    };
    nav.appendChild(send);

    var again = el('button', 'btn ghost', already ? '다른 분이 새로 답하기' : '처음부터 다시 답하기'); again.type = 'button'; again.style.alignSelf = 'flex-start';
    again.onclick = function(){
      if (again.dataset.sure){ A = {}; try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '-sent'); } catch (e) {} go(0); }
      else { again.dataset.sure = '1'; again.textContent = '답을 모두 지웁니다. 한 번 더 누르면 지워집니다'; }
    };
    stage.appendChild(again);
  }

  /* 숫자 키로도 고를 수 있습니다 */
  document.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT') { if (e.key === 'Enter' && tag === 'INPUT'){ e.preventDefault(); next(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && stage._pick && n <= stage._n && (STEPS[idx].type === 'single' || STEPS[idx].type === 'multi' || STEPS[idx].type === 'scale')){
      var btn = stage.querySelectorAll('.opt')[n - 1];
      if (btn && !btn.disabled){ e.preventDefault(); stage._pick(n - 1); }
    } else if (e.key === 'Enter'){ var nb = document.getElementById('nextBtn'); if (nb && !nb.disabled){ e.preventDefault(); nb.click(); } }
  });

  render(false);
})();
</script>
</body>
</html>
